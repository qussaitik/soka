<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chief Naglaa - قريباً</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --accent-gold: #f59e0b;
            --accent-light: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(245, 158, 11, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(251, 191, 36, 0.1) 0%, transparent 40%);
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            text-align: center;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-gold);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 36px;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 36px;
        }

        .time-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            padding: 16px 8px;
            border-radius: 16px;
        }

        .number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-light);
            line-height: 1.2;
        }

        .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .notify-form {
            display: flex;
            gap: 10px;
            max-width: 450px;
            margin: 0 auto;
        }

        .notify-form input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .notify-form button {
            padding: 14px 24px;
            border-radius: 12px;
            border: none;
            background: var(--accent-gold);
            color: #000;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            .container { padding: 28px 16px; }
            h1 { font-size: 2rem; }
            .notify-form { flex-direction: column; }
            .notify-form button { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">قريباً جداً</div>
        <h1>Chief Naglaa</h1>
        <p class="subtitle">نُعد لكم تجربة استثنائية في فنون الطهي. المتبقي على الانطلاق الكبير:</p>

        <div class="countdown">
            <div class="time-box">
                <div class="number" id="days">05</div>
                <div class="label">يوم</div>
            </div>
            <div class="time-box">
                <div class="number" id="hours">00</div>
                <div class="label">ساعة</div>
            </div>
            <div class="time-box">
                <div class="number" id="minutes">00</div>
                <div class="label">دقيقة</div>
            </div>
            <div class="time-box">
                <div class="number" id="seconds">00</div>
                <div class="label">ثانية</div>
            </div>
        </div>

        <form class="notify-form" onsubmit="event.preventDefault(); alert('شكراً لاهتمامك!');">
            <input type="email" placeholder="أدخل بريدك الإلكتروني..." required>
            <button type="submit">أبلغني عند الإطلاق</button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const targetDate = new Date().getTime() + (5 * 24 * 60 * 60 * 1000);

            function updateCountdown() {
                const now = new Date().getTime();
                const difference = targetDate - now;

                if (difference > 0) {
                    const d = Math.floor(difference / (1000 * 60 * 60 * 24));
                    const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((difference % (1000 * 60)) / 1000);

                    const elDays = document.getElementById('days');
                    const elHours = document.getElementById('hours');
                    const elMinutes = document.getElementById('minutes');
                    const elSeconds = document.getElementById('seconds');

                    if (elDays) elDays.innerText = d < 10 ? '0' + d : d;
                    if (elHours) elHours.innerText = h < 10 ? '0' + h : h;
                    if (elMinutes) elMinutes.innerText = m < 10 ? '0' + m : m;
                    if (elSeconds) elSeconds.innerText = s < 10 ? '0' + s : s;
                }
            }

            updateCountdown();
            setInterval(updateCountdown, 1000);
        });
    </script>
</body>
</html>
