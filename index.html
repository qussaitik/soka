<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chief Naglaa - جميع الوصفات والفيديوهات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --accent-gold: #f59e0b;
            --accent-red: #ff0000;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(245, 158, 11, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(255, 0, 0, 0.05) 0%, transparent 40%);
            padding: 20px 15px;
        }

        .header {
            max-width: 1000px;
            margin: 20px auto 30px auto;
            text-align: center;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--accent-gold);
            margin-bottom: 15px;
            object-fit: cover;
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.2);
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 900;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.bio {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 600px;
            margin: 0 auto 20px auto;
            line-height: 1.6;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: transform 0.2s, opacity 0.2s;
            color: #fff;
        }

        .social-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .btn-yt { background: var(--accent-red); }

        .search-container {
            max-width: 500px;
            margin: 0 auto 35px auto;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 14px 45px 14px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(30, 41, 59, 0.8);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-container input:focus {
            border-color: var(--accent-gold);
        }

        .search-container i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .videos-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: right;
            border-right: 4px solid var(--accent-gold);
            padding-right: 12px;
            color: #fff;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            overflow: hidden;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .video-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            overflow: hidden;
            background: #000;
        }

        .thumbnail-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .video-card:hover .thumbnail-wrapper img {
            transform: scale(1.05);
        }

        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
            transition: background 0.2s;
        }

        .video-card:hover .play-icon {
            background: var(--accent-red);
        }

        .video-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .video-title {
            font-size: 0.95rem;
            font-weight: 700;
            text-align: right;
            line-height: 1.5;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .watch-btn {
            font-size: 0.85rem;
            color: var(--accent-gold);
            font-weight: 600;
            text-align: right;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .videos-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="header">
        <img src="https://i.ytimg.com/vi/RYHwupXZfA4/hqdefault.jpg" alt="Chief Naglaa" class="profile-img">
        <h1>Chief Naglaa</h1>
        <p class="bio">مرحباً بكم في المكتبة الشاملة لشيف نجلاء. استمتعوا بجميع وصفات الطهي والأكلات البحرية والمحاشي مباشرة.</p>

        <div class="social-links">
            <a href="https://www.youtube.com/@Naglaaabousaad" target="_blank" class="social-btn btn-yt">
                <i class="fab fa-youtube"></i> زيارة القناة على يوتيوب
            </a>
        </div>

        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن وصفة أو فيديو..." onkeyup="filterVideos()">
        </div>
    </header>

    <main class="videos-container">
        <div class="section-title">جميع الفيديوهات والوصفات</div>

        <div class="videos-grid" id="videosGrid">
            <!-- سيتم إنشاء واستدعاء كافة الفيديوهات تلقائياً عبر السكريبت -->
        </div>
    </main>

    <script>
        // قائمة بكل الفيديوهات الخاصة بالقناة
        const allVideos = [
            {
                id: "RYHwupXZfA4",
                title: "أجمد صينية محشي بحري كالماري وبصل وكرات بطعم خطير #وصفات سهلة ولذيذة #أكلات بحرية #محاشي"
            },
            {
                id: "t1mlJJnH6Qk",
                title: "جزيرة المزرعة السعيدة #العاب #games"
            },
            {
                id: "ms1XlGtUF_s",
                title: "بث مباشر - حكايات نوجة في Ireland"
            }
        ];

        function renderAllVideos() {
            const grid = document.getElementById('videosGrid');
            grid.innerHTML = '';

            allVideos.forEach(video => {
                const card = document.createElement('a');
                card.href = `https://www.youtube.com/watch?v=${video.id}`;
                card.target = "_blank";
                card.className = "video-card";
                card.innerHTML = `
                    <div class="thumbnail-wrapper">
                        <img src="https://i.ytimg.com/vi/${video.id}/hqdefault.jpg" alt="${video.title}">
                        <div class="play-icon"><i class="fas fa-play"></i></div>
                    </div>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="watch-btn"><i class="fas fa-external-link-alt"></i> مشاهدة على يوتيوب</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterVideos() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.video-card');

            cards.forEach(card => {
                const title = card.querySelector('.video-title').innerText.toLowerCase();
                if (title.includes(input)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        }

        document.addEventListener("DOMContentLoaded", renderAllVideos);
    </script>
</body>
</html>
